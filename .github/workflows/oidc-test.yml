name: Build and Upload Artifact

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CodeDeploy revision
        run: |
          echo "Creating CodeDeploy revision..."

          mkdir -p artifacts

          zip -r "artifacts/cloudops-app-${GITHUB_SHA}.zip" appspec.yml app scripts

          echo "CodeDeploy revision created:"
          ls -lh artifacts/

          echo ""
          echo "Revision contents:"
          unzip -l "artifacts/cloudops-app-${GITHUB_SHA}.zip"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::915993063181:role/CloudOps-GitHubActions-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      - name: Upload artifact to S3
        run: |
          echo "Uploading artifact to S3..."

          aws s3 cp "artifacts/cloudops-app-${GITHUB_SHA}.zip" "s3://${{ vars.S3_BUCKET }}/artifacts/"

          echo "Upload completed."

      - name: Verify S3 artifact
        run: |
          echo "S3 artifacts:"
          aws s3 ls "s3://${{ vars.S3_BUCKET }}/artifacts/"
